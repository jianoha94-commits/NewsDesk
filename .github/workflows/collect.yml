name: 일일 이슈 수집

on:
  schedule:
    # 매일 07:30 KST (22:30 UTC)
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 이슈 수집
        run: node scripts/collect.mjs

      - name: 커밋 및 푸시
        run: |
          git config user.name "zainoha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(date -u -d '+9 hours' +%Y-%m-%d) 이슈"
            git push
          fi
